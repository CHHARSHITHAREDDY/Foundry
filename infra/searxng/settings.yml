use_default_settings: true
server:
  secret_key: "venture-studio-searxng-local-secret-key"
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json
engines:
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: github
    engine: github
    shortcut: gh
