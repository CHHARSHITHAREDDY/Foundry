# Code asks for a TIER, never a model name. Set each tier to your provider's model id
# (GLM / Kimi / DeepSeek / Qwen served by vLLM or any OpenAI-compatible host).
model_list:
  - { model_name: reasoner,   litellm_params: { model: openai/REPLACE_ME_REASONER, api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
  - { model_name: coder,      litellm_params: { model: openai/REPLACE_ME_CODER,    api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
  - { model_name: writer,     litellm_params: { model: openai/REPLACE_ME_WRITER,   api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
  - { model_name: fast,       litellm_params: { model: openai/REPLACE_ME_FAST,     api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
  - { model_name: vision,     litellm_params: { model: openai/REPLACE_ME_VISION,   api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
  - { model_name: embeddings, litellm_params: { model: openai/REPLACE_ME_EMBED,    api_base: os.environ/INFERENCE_BASE_URL, api_key: os.environ/INFERENCE_API_KEY } }
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
